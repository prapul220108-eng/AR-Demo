<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>MineSafe AR - Hazard Demo</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .instructions {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 999;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      max-width: 260px;
    }
  </style>
</head>
<body>
  <div class="instructions">
    Point your camera at the Hiro marker (print it or show it on another screen) to see the hazard warning appear in AR.
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">

      <!-- Rotating warning sign -->
      <a-entity position="0 0.5 0" rotation="0 0 0">
        <a-cone
          color="#FFB300"
          height="0.6"
          radius-bottom="0.5"
          radius-top="0"
          position="0 0.3 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-cone>
        <a-text
          value="HAZARD DETECTED"
          color="#B00020"
          align="center"
          position="0 1.1 0"
          scale="1.3 1.3 1.3">
        </a-text>
        <a-text
          value="Blind Spot - Moving Machinery"
          color="#222"
          align="center"
          position="0 0.9 0"
          scale="0.8 0.8 0.8">
        </a-text>
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
